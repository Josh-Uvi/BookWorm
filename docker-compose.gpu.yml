# NVIDIA GPU support for faster-whisper and Ollama.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  server:
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
