# ════════════════════════════════════════════════════════════════════
# Netlify — free static hosting for the SPA (free demo topology).
# Netlify builds Client/ and publishes dist/; the app talks to Render
# (WebSockets) and Contentful (books) over their public URLs.
#
# Set these build-time variables in Site configuration → Environment
# variables (they are baked into the bundle — see docs/deployment-render.md §6):
#   VITE_WS_URL                   = wss://<render-server>.onrender.com/ws
#   VITE_CONTENTFUL_SPACE_ID      = <space id>        (optional CMS catalogue)
#   VITE_CONTENTFUL_ACCESS_TOKEN  = <delivery token>  (read-only CDA token)
# Optional (only if you also run the Render media server / API):
#   VITE_MEDIA_URL = https://<render-media>.onrender.com
#   VITE_API_URL   = https://<render-media>.onrender.com/api
# ════════════════════════════════════════════════════════════════════

[build]
  base = "Client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — React Router owns the paths, so unknown URLs serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed filenames under /assets — cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
