# AI Reading Assistant — Nginx config (SPA + WebSocket + media proxy).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — everything unknown falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket traffic → Python server (same-origin /ws for the browser).
    location /ws {
        proxy_pass http://server:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Media library (books.json + PDFs) → Python media server.
    location /media/ {
        proxy_pass http://server:8766/;
        proxy_set_header Host $host;
    }

    # Reading-level catalogue API → Python HTTP server.
    location /api/ {
        proxy_pass http://server:8766/api/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
